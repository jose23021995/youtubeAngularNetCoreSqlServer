<router-outlet />
<!--
    🔍 ¿Para qué sirve <router-outlet />?
    Es como decirle a Angular:
    👉🏼 "Aquí es donde quiero que muestres el componente que coincida con la ruta actual."

    Si no pones un <router-outlet>, nunca vas a ver los componentes que están definidos en las rutas, porque Angular no tendría dónde colocarlos.
-->
